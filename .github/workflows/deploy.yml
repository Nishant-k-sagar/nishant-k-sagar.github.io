name: Main workflow

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run check

      - name: Build Astro site
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      # Tell Bing, Yandex and other IndexNow participants about every URL.
      # The key file is public/af1b36223c4f11661ec67a9f6fa83e4e.txt.
      - name: Ping IndexNow
        continue-on-error: true
        env:
          INDEXNOW_KEY: af1b36223c4f11661ec67a9f6fa83e4e
        run: |
          node -e '
          const key = process.env.INDEXNOW_KEY;
          const host = "nishant-k-sagar.github.io";
          (async () => {
            const indexUrl = `https://${host}/sitemap-index.xml`;
            const keyLocation = `https://${host}/${key}.txt`;
            const indexXml = await (await fetch(indexUrl)).text();
            const children = [...indexXml.matchAll(/<loc>(.*?)<\/loc>/g)].map((match) => match[1]);
            const urls = new Set([`https://${host}/`]);
            for (const child of children) {
              const xml = await (await fetch(child)).text();
              for (const match of xml.matchAll(/<loc>(.*?)<\/loc>/g)) urls.add(match[1]);
            }
            // The key file can lag a few seconds behind the deploy.
            for (let attempt = 0; attempt < 6; attempt++) {
              const check = await fetch(keyLocation, { method: "HEAD" });
              if (check.ok) break;
              await new Promise((resolve) => setTimeout(resolve, 5000));
            }
            const response = await fetch("https://api.indexnow.org/indexnow", {
              method: "POST",
              headers: { "Content-Type": "application/json; charset=utf-8" },
              body: JSON.stringify({
                host,
                key,
                keyLocation,
                urlList: [...urls],
              }),
            });
            console.log(`IndexNow responded ${response.status} for ${urls.size} URLs`);
          })().catch((error) => {
            console.error("IndexNow failed:", error.message);
          });
          '